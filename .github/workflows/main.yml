name: Build RK3566 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ Checkout source (safe)
      - name: Checkout kernel source
        uses: actions/checkout@v4

      # 2️⃣ Install dependencies
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            python3

      # 3️⃣ Setup toolchain (clang OR gcc)
      # 👉 Use this if kernel supports clang
      - name: Setup Clang
        run: |
          sudo apt install -y clang llvm lld

      # 4️⃣ Build kernel
      - name: Build RK3566 kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make rk3326_linux_defconfig
          make -j$(nproc) \
            KERNEL_DTS=rk3326 \
            KERNEL_CONFIG=rk3326_linux_defconfig

      # 5️⃣ Upload build output
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3566-kernel
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts
