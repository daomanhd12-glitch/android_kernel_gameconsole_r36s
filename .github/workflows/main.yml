name: Build Android Kernel (R36S)

on:
  push:
    branches: [ "lineage-18.1" ]
  pull_request:
    branches: [ "lineage-18.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          bc bison flex libssl-dev \
          make libc6-dev libncurses5-dev \
          build-essential ccache

    - name: Set Environment
      run: |
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV

    - name: Kernel Defconfig
      run: |
        make rk3326_linux_defconfig

    - name: Build Kernel
      run: |
        make -j$(nproc)

    - name: Copy Build Outputs
      run: |
        mkdir output
        cp arch/arm64/boot/Image output/
        cp arch/arm64/boot/dts/rockchip/*.dtb output/ || true
        cp arch/arm64/boot/dts/rockchip/overlay/*.dtbo output/ || true
        find . -name "*.ko" -exec cp {} output/ \; || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: R36S-Kernel
        path: output
